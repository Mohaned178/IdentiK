# Local development stack for Docker Desktop (Windows/Mac). Separate from the
# production deployment in deploy/ — same image, same migrate-explicit contract,
# development-only behavior via IDENTIK_DEV_MODE=1.
#
# The compose project is named `identik-local`, so Docker Desktop shows the
# stack under that name and its named volumes are prefixed identik-local_.
#
#   docker compose up -d --build     # build the local image (first time)
#   docker compose run --rm app migrate
#   docker compose up -d             # start app + postgres
#   docker compose down              # stops; named volume survives
#   docker compose down -v           # also delete the database volume
#
name: identik-local

services:
  app:
    image: identik:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgresql://postgres:${LOCAL_POSTGRES_PASSWORD:-identik-local}@postgres:5432/identik
      IDENTIK_BASE_URL: http://localhost:${LOCAL_APP_PORT:-3000}
      IDENTIK_DEV_MODE: "1"
      MAIL_TRANSPORT_BINDING: capture
      IDENTIK_TRUST_PROXY: "false"
    ports:
      - "${LOCAL_APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-identik-local}
      POSTGRES_DB: identik
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identik"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata: