name: Feature request
description: Propose a change in behaviour or a new capability
title: 'feat: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature work in this repository is planned as a spec plus implementation
        tickets under `.scratch/<feature-slug>/`. A good request states the
        problem and the user, so it can be turned into a ticket without an
        interview. See `docs/agents/issue-tracker.md`.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The user and the job they cannot do today. Avoid prescribing the solution here.
      placeholder: As an Administrator, I cannot ..., so ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would change, and where in the domain it belongs. Use the CONTEXT.md vocabulary.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other shapes you weighed and why they lost.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to the relevant spec, tickets, ADRs, or external references.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and tickets for this request.
          required: true
