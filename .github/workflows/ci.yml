name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      IDENTIK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: End-to-end tests
        run: npm run test -w e2e

  image:
    name: Build image (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Detect image-relevant changes
        id: changed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -Eq '^(backend/|Dockerfile$|\.dockerignore$|docker-entrypoint\.sh$|package(-lock)?\.json$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request' || steps.changed.outputs.relevant == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build the image without pushing
        if: github.event_name != 'pull_request' || steps.changed.outputs.relevant == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          tags: identik:ci
