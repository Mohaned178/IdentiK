name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      IDENTIK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      IMAGE_NAME: ghcr.io/mohaned178/identik

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: End-to-end tests
        run: npm run test -w e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build the image for assertion
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.tags.outputs.short }}

      - name: Assert the built image
        run: |
          set -euo pipefail
          IMAGE_LOCAL="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          echo "Asserting ${IMAGE_LOCAL} ..."
          docker run --rm "$IMAGE_LOCAL" ls /app/backend/prisma/migrations
          test -n "$(docker run --rm "$IMAGE_LOCAL" ls /app/backend/prisma/migrations)"
          PRISMA_PKG_VERSION="$(docker run --rm "$IMAGE_LOCAL" node -p "require('prisma/package.json').version")"
          echo "prisma package version: ${PRISMA_PKG_VERSION}"
          test "$PRISMA_PKG_VERSION" = "7.10.0"
          docker run --rm "$IMAGE_LOCAL" npx --no-install prisma --version | tee /tmp/prisma-version.txt
          grep -Eq '(^|[^0-9.])7\.10\.0([^0-9.]|$)' /tmp/prisma-version.txt
          echo "Image assertion passed."

      - name: Smoke the built image (migrate and serve against the job Postgres)
        run: |
          set -euo pipefail
          IMAGE_LOCAL="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          DB='postgresql://postgres:postgres@127.0.0.1:5432/postgres'
          docker run --rm --network host -e DATABASE_URL="$DB" "$IMAGE_LOCAL" migrate >/dev/null
          cid="$(docker run -d --network host \
            -e DATABASE_URL="$DB" \
            -e IDENTIK_BASE_URL=http://localhost:3000 \
            -e IDENTIK_DEV_MODE=1 \
            -e MAIL_TRANSPORT_BINDING=capture \
            -e IDENTIK_TRUST_PROXY=false \
            "$IMAGE_LOCAL" server)"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          deadline=$((SECONDS + 90))
          until curl -fsS http://127.0.0.1:3000/health/live >/dev/null 2>&1; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "app never became live" >&2; docker logs "$cid" >&2; exit 1; }
            sleep 2
          done
          body="$(curl -fsS http://127.0.0.1:3000/health/ready)"
          case "$body" in
            *'"database":{"ok":true}'*) echo "Smoke passed: readiness reports database.ok=true on ${IMAGE_LOCAL}" ;;
            *) echo "Smoke failed: ${body}" >&2; docker logs "$cid" >&2; exit 1 ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the asserted image
        id: push
        env:
          SHORT_SHA: ${{ steps.tags.outputs.short }}
        run: |
          set -euo pipefail
          version_tag="${GITHUB_REF_NAME}"
          docker push "${IMAGE_NAME}:${version_tag}"
          docker push "${IMAGE_NAME}:sha-${SHORT_SHA}"
          digest="sha256:$(docker buildx imagetools inspect --raw "${IMAGE_NAME}:${version_tag}" | sha256sum | awk '{print $1}')"
          test -n "${digest#sha256:}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/mohaned178/identik
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Package the built backend
        run: |
          mkdir -p release
          archive="release/identik-backend-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$archive" -C backend dist package.json prisma prisma.config.ts
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          digest="${{ steps.push.outputs.digest }}"
          version_tag="${GITHUB_REF_NAME}"
          image="${IMAGE_NAME}:${version_tag}"
          tarball="release/identik-backend-${version_tag}.tar.gz"
          tarball_sha="$(awk '{print $1}' "${tarball}.sha256")"
          echo "${image}@${digest}" > "release/identik-image-${version_tag}.digest"
          sha256sum "release/identik-image-${version_tag}.digest" > "release/identik-image-${version_tag}.digest.sha256"
          gh release create "${version_tag}" \
            --title "${version_tag}" \
            --generate-notes \
            release/*
          body="$(gh release view "${version_tag}" --json body --jq .body)"
          {
            printf '%s\n\n' "$body"
            printf '### Container image\n\n'
            printf '```\n%s@%s\n```\n' "$image" "$digest"
            printf '\nAlso available as `%s:sha-%s` (same digest).\n' "${IMAGE_NAME}" "${{ steps.tags.outputs.short }}"
            printf '\n### Backend tarball\n\n'
            printf '```\n%s  sha256:%s\n```\n' "$(basename "$tarball")" "$tarball_sha"
          } > /tmp/release-notes.md
          gh release edit "${version_tag}" --notes-file /tmp/release-notes.md
