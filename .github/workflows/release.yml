name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      IDENTIK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      IMAGE_NAME: ghcr.io/mohaned178/identik

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: End-to-end tests
        run: npm run test -w e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build the image for assertion
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.tags.outputs.short }}

      - name: Assert the built image
        run: |
          set -euo pipefail
          IMAGE_LOCAL="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          echo "Asserting ${IMAGE_LOCAL} ..."
          docker run --rm "$IMAGE_LOCAL" ls /app/backend/prisma/migrations
          test -n "$(docker run --rm "$IMAGE_LOCAL" ls /app/backend/prisma/migrations)"
          PRISMA_PKG_VERSION="$(docker run --rm "$IMAGE_LOCAL" node -p "require('prisma/package.json').version")"
          echo "prisma package version: ${PRISMA_PKG_VERSION}"
          test "$PRISMA_PKG_VERSION" = "7.10.0"
          docker run --rm "$IMAGE_LOCAL" npx --no-install prisma --version | tee /tmp/prisma-version.txt
          grep -Eq '(^|[^0-9.])7\.10\.0([^0-9.]|$)' /tmp/prisma-version.txt
          echo "Image assertion passed."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.tags.outputs.short }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/mohaned178/identik
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Package the built backend
        run: |
          mkdir -p release
          archive="release/identik-backend-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$archive" -C backend dist package.json prisma prisma.config.ts
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          digest="${{ steps.push.outputs.digest }}"
          version_tag="${GITHUB_REF_NAME}"
          image="${IMAGE_NAME}:${version_tag}"
          echo "${image}@${digest}" > "release/identik-image-${version_tag}.digest"
          sha256sum "release/identik-image-${version_tag}.digest" > "release/identik-image-${version_tag}.digest.sha256"
          gh release create "${version_tag}" \
            --title "${version_tag}" \
            --generate-notes \
            release/*
          body="$(gh release view "${version_tag}" --json body --jq .body)"
          {
            printf '%s\n\n' "$body"
            printf '### Container image\n\n'
            printf '```\n%s@%s\n```\n' "$image" "$digest"
            printf '\nAlso available as `ghcr.io/mohaned178/identik:sha-%s` (same digest).\n' "${{ steps.tags.outputs.short }}"
          } > /tmp/release-notes.md
          gh release edit "${version_tag}" --notes-file /tmp/release-notes.md
