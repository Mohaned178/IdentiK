name: identik

services:
  app:
    image: ${IDENTIK_IMAGE_TAG:?set IDENTIK_IMAGE_TAG in deploy/.env}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/identik
      IDENTIK_BASE_URL: https://${IDENTIK_HOSTNAME:?set IDENTIK_HOSTNAME in deploy/.env}
      IDENTIK_TRUST_PROXY: ${IDENTIK_TRUST_PROXY:?set IDENTIK_TRUST_PROXY in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Conservative caps for the dogfooding VPS; adjust to the provisioned host.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - internal

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: identik
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identik"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - internal

  proxy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      IDENTIK_HOSTNAME: ${IDENTIK_HOSTNAME:?set IDENTIK_HOSTNAME in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
